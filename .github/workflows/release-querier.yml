name: release-querier

on:
  push:
    tags:
      - 'querier-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can diff cmd/querier/ against the previous tag.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic zip
        run: ./scripts/build-querier.sh

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          # Most recent prior querier-v* tag (excluding the one we're releasing).
          prev="$(git tag --list 'querier-v*' --sort=-creatordate \
                  | grep -vFx "$tag" \
                  | head -n1 || true)"

          size_bytes="$(wc -c < cmd/querier/build/querier.zip | tr -d ' ')"
          sha256="$(awk '{print $1}' cmd/querier/build/querier.zip.sha256)"

          {
            echo "## Artifact"
            echo
            echo "- \`querier.zip\` — ${size_bytes} bytes"
            echo "- SHA-256: \`${sha256}\`"
            echo
            echo "Pin from Terraform:"
            echo
            echo "\`\`\`hcl"
            echo "function_zip_url    = \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/querier.zip\""
            echo "function_zip_sha256 = \"${sha256}\""
            echo "\`\`\`"
            echo
            echo "## Changes"
            echo
            if [[ -n "$prev" ]]; then
              echo "Since [\`${prev}\`](../../releases/tag/${prev}) (commits touching \`cmd/querier/\`):"
              echo
              git log "${prev}..${tag}" --pretty='- %s (%h)' -- cmd/querier
            else
              echo "Initial querier release. Commits touching \`cmd/querier/\`:"
              echo
              git log "$tag" --pretty='- %s (%h)' -- cmd/querier
            fi
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file release-notes.md \
            cmd/querier/build/querier.zip \
            cmd/querier/build/querier.zip.sha256
